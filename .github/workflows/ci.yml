name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy --strict src/caregraph
      - run: pytest -q
      - run: python scripts/demo.py
      # Phase 4 regression gate: fails the build on faithfulness / refusal /
      # red-team regressions (non-zero exit stops the pipeline).
      - run: python scripts/eval_gate.py
