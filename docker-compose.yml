# Local stack: the API, a managed vector DB (Qdrant), and a Phoenix trace collector.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      CAREGRAPH_VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:4317
    depends_on:
      - qdrant
      - phoenix

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # UI
      - "4317:4317"   # OTLP gRPC
